[project]
name = "sasp-backend"
version = "0.1.0"
description = "Authorized Security Assessment Platform — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.2,<7.0",
    "httpx>=0.27,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-json-logger>=2.0,<3.0",
    "slowapi>=0.1,<1.0",
    "celery>=5.3,<6.0",
    "kombu>=5.3,<6.0",
    "dnspython>=2.6,<3.0",
    "cryptography>=42.0,<43.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "prometheus-client>=0.19,<1.0",
    "opentelemetry-api>=1.22,<2.0",
    "opentelemetry-sdk>=1.22,<2.0",
    "opentelemetry-exporter-otlp>=1.22,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.43,<1.0",
    "opentelemetry-instrumentation-celery>=0.43,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43,<1.0",
    "opentelemetry-instrumentation-psycopg>=0.43,<1.0",
    "opentelemetry-instrumentation-redis>=0.43,<1.0",
    "opentelemetry-instrumentation-requests>=0.43,<1.0",
    "psutil>=5.9,<6.0",
    "minio>=7.2,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "locust>=2.18,<3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic autogenerates migration files; lint them as-is, not by hand.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "C4",
    "RUF",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false