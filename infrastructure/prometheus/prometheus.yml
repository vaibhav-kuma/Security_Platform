# Phase 17 Prometheus configuration - scrapes all platform components
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sasp-local'
    environment: 'development'

# Alertmanager (not configured in local dev)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (for alerting rules)
# rule_files:
#   - 'rules/*.yml'

scrape_configs:
  # Backend API metrics
  - job_name: 'sasp-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'

  # Worker metrics (via Celery exporter if available, or custom endpoint)
  - job_name: 'sasp-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8000']
        labels:
          service: 'worker'
          component: 'celery'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # Node exporter (if deployed)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # cAdvisor for container metrics (if deployed)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

  # Redis metrics (if redis-exporter deployed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (if postgres-exporter deployed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # MinIO metrics
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          component: 'storage'

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          component: 'tracing'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'