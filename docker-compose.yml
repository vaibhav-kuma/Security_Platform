# docker-compose.yml
# Authorized Security Assessment Platform — local development stack.
# One-command startup: ./scripts/dev-up.sh  (see docs/LOCAL_DEV.md)
#
# Phase 1 scope: service topology + healthy defaults only. No scanning engine,
# no domain schema. Worker service is a Phase 7 placeholder (dummy entrypoint).

name: sasp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend_net]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change-me-dev-only}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend_net]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      # Phase 17 observability
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      PROMETHEUS_METRICS_ENABLED: "true"
      TRACING_ENABLED: "true"
      LOG_JSON_FORMAT: "true"
      LOG_LEVEL: "INFO"
      # Worker settings
      WORKER_MAX_CONCURRENT_JOBS: "4"
      WORKER_CONCURRENCY: "4"
      SCAN_JOB_TIMEOUT_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend_net, frontend_net]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Phase 7+: Real worker with queue consumer, isolation, resource limits
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      # Phase 17 observability
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      PROMETHEUS_METRICS_ENABLED: "true"
      TRACING_ENABLED: "true"
      LOG_JSON_FORMAT: "true"
      LOG_LEVEL: "INFO"
      # Worker settings
      WORKER_MAX_CONCURRENT_JOBS: "4"
      WORKER_CONCURRENCY: "4"
      SCAN_JOB_TIMEOUT_MINUTES: "60"
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--queues=priority,scans,maintenance", "--concurrency=4", "--max-tasks-per-child=100", "--max-memory-per-child=500000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Celery beat scheduler for periodic tasks
  worker-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--scheduler=celery.beat.PersistentScheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [frontend_net]

  # --- Observability stack (Phase 17) ---
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [backend_net]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-dev-only}
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [backend_net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    depends_on:
      - prometheus
    networks: [backend_net]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge